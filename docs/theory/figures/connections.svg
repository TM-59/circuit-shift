<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="sans-serif" font-size="12">
<rect width="700" height="320" fill="#ffffff"/>
<text x="16" y="26" font-size="16" font-weight="bold" fill="#222">A connection needs facing ports on both tiles</text>
<text x="30" y="60" fill="#222">the bar faces north-south: lamp dark</text>
<rect x="30" y="70" width="74" height="74" fill="#f4f4f4" stroke="#cccccc"/>
<line x1="67.0" y1="107.0" x2="104.0" y2="107.0" stroke="#e6a800" stroke-width="8" stroke-linecap="round"/>
<rect x="54.0" y="94.0" width="26" height="26" fill="#1f77b4"/>
<text x="67.0" y="111.0" text-anchor="middle" fill="#ffffff" font-size="11">S</text>
<rect x="108" y="70" width="74" height="74" fill="#f4f4f4" stroke="#cccccc"/>
<line x1="145.0" y1="107.0" x2="145.0" y2="144.0" stroke="#777777" stroke-width="8" stroke-linecap="round"/>
<line x1="145.0" y1="107.0" x2="145.0" y2="70.0" stroke="#777777" stroke-width="8" stroke-linecap="round"/>
<circle cx="145.0" cy="107.0" r="5" fill="#777777"/>
<rect x="186" y="70" width="74" height="74" fill="#f4f4f4" stroke="#cccccc"/>
<line x1="223.0" y1="107.0" x2="186.0" y2="107.0" stroke="#777777" stroke-width="8" stroke-linecap="round"/>
<circle cx="223.0" cy="107.0" r="14" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="223.0" y="111.0" text-anchor="middle" fill="#333333" font-size="11">L</text>
<text x="360" y="60" fill="#222">one turn later: facing ports, lamp lit</text>
<rect x="360" y="70" width="74" height="74" fill="#f4f4f4" stroke="#cccccc"/>
<line x1="397.0" y1="107.0" x2="434.0" y2="107.0" stroke="#e6a800" stroke-width="8" stroke-linecap="round"/>
<rect x="384.0" y="94.0" width="26" height="26" fill="#1f77b4"/>
<text x="397.0" y="111.0" text-anchor="middle" fill="#ffffff" font-size="11">S</text>
<rect x="438" y="70" width="74" height="74" fill="#f4f4f4" stroke="#cccccc"/>
<line x1="475.0" y1="107.0" x2="438.0" y2="107.0" stroke="#e6a800" stroke-width="8" stroke-linecap="round"/>
<line x1="475.0" y1="107.0" x2="512.0" y2="107.0" stroke="#e6a800" stroke-width="8" stroke-linecap="round"/>
<circle cx="475.0" cy="107.0" r="5" fill="#e6a800"/>
<rect x="516" y="70" width="74" height="74" fill="#f4f4f4" stroke="#cccccc"/>
<line x1="553.0" y1="107.0" x2="516.0" y2="107.0" stroke="#e6a800" stroke-width="8" stroke-linecap="round"/>
<circle cx="553.0" cy="107.0" r="14" fill="#ffd43b" stroke="#333333" stroke-width="2"/>
<text x="553.0" y="111.0" text-anchor="middle" fill="#333333" font-size="11">L</text>
<text x="30" y="190" fill="#222">the wire has no west port: not a connection</text>
<rect x="30" y="200" width="74" height="74" fill="#f4f4f4" stroke="#cccccc"/>
<line x1="67.0" y1="237.0" x2="104.0" y2="237.0" stroke="#e6a800" stroke-width="8" stroke-linecap="round"/>
<rect x="54.0" y="224.0" width="26" height="26" fill="#1f77b4"/>
<text x="67.0" y="241.0" text-anchor="middle" fill="#ffffff" font-size="11">S</text>
<rect x="108" y="200" width="74" height="74" fill="#f4f4f4" stroke="#cccccc"/>
<line x1="145.0" y1="237.0" x2="182.0" y2="237.0" stroke="#777777" stroke-width="8" stroke-linecap="round"/>
<circle cx="145.0" cy="237.0" r="5" fill="#777777"/>
<rect x="186" y="200" width="74" height="74" fill="#f4f4f4" stroke="#cccccc"/>
<line x1="223.0" y1="237.0" x2="186.0" y2="237.0" stroke="#777777" stroke-width="8" stroke-linecap="round"/>
<circle cx="223.0" cy="237.0" r="14" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="223.0" y="241.0" text-anchor="middle" fill="#333333" font-size="11">L</text>
<text x="360" y="190" fill="#222">ports pointing off the board connect nothing</text>
<rect x="360" y="200" width="74" height="74" fill="#f4f4f4" stroke="#cccccc"/>
<line x1="397.0" y1="237.0" x2="360.0" y2="237.0" stroke="#e6a800" stroke-width="8" stroke-linecap="round"/>
<rect x="384.0" y="224.0" width="26" height="26" fill="#1f77b4"/>
<text x="397.0" y="241.0" text-anchor="middle" fill="#ffffff" font-size="11">S</text>
<rect x="438" y="200" width="74" height="74" fill="#f4f4f4" stroke="#cccccc"/>
<line x1="475.0" y1="237.0" x2="438.0" y2="237.0" stroke="#777777" stroke-width="8" stroke-linecap="round"/>
<line x1="475.0" y1="237.0" x2="512.0" y2="237.0" stroke="#777777" stroke-width="8" stroke-linecap="round"/>
<circle cx="475.0" cy="237.0" r="5" fill="#777777"/>
<rect x="516" y="200" width="74" height="74" fill="#f4f4f4" stroke="#cccccc"/>
<line x1="553.0" y1="237.0" x2="590.0" y2="237.0" stroke="#777777" stroke-width="8" stroke-linecap="round"/>
<circle cx="553.0" cy="237.0" r="14" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="553.0" y="241.0" text-anchor="middle" fill="#333333" font-size="11">L</text>
</svg>
